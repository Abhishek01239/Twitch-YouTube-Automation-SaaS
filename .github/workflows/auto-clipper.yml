name: Auto Clipper

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render clips as artifacts, post nothing)"
        type: boolean
        default: true
      url:
        description: "Optional: clip just this Twitch/YouTube URL instead of the configured sources"
        type: string
        required: false
      max_posts:
        description: "Optional: max clips to post this run"
        type: string
        required: false

permissions:
  contents: write   # to commit auto-clipper/state/state.json (avoids re-posting)

concurrency:
  group: auto-clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: auto-clipper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auto-clipper/requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('auto-clipper/config.yaml') }}
          restore-keys: whisper-

      - name: Write yt-dlp cookies (optional)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s\n' "$YTDLP_COOKIES" > cookies.txt
            echo "YTDLP_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          LIVE_VAR: ${{ vars.AUTO_CLIPPER_LIVE }}
        run: |
          # Manual runs follow the checkbox. Scheduled runs only post once the
          # repository variable AUTO_CLIPPER_LIVE is set to "true".
          if [ "$EVENT" = "workflow_dispatch" ]; then dry="$INPUT_DRY_RUN";
          elif [ "$LIVE_VAR" = "true" ]; then dry=false; else dry=true; fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "Dry run: $dry"

      - name: Run auto clipper
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_MAX: ${{ inputs.max_posts }}
        run: |
          args=()
          [ -n "$INPUT_URL" ] && args+=(--url "$INPUT_URL")
          [ -n "$INPUT_MAX" ] && args+=(--max-posts "$INPUT_MAX")
          python -m clipper.main "${args[@]}"

      - name: Upload rendered clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: auto-clipper/output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save state
        if: always() && steps.mode.outputs.dry_run == 'false'
        run: |
          git config user.name "auto-clipper[bot]"
          git config user.email "auto-clipper[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m "auto-clipper: update state [skip ci]"
          git pull --rebase && git push
